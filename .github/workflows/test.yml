name: ML Tests & CML Report

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - 'notebooks/**'
      - '**.dvc'
      - 'data/**'
      - 'azure-deploy/**'
  

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  
  ml-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install project
        run: pip install -e .

      - name: Run ML tests
        run: |
          pytest tests/ml_tests.py -v --tb=short --junitxml=test-results.xml 2>&1 | tee pytest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-results
          path: |
            test-results.xml
            metrics_report.md
            metrics.json
            pytest_output.txt

  # ── Job 2: CML posts metrics as PR comment ──
  cml-report:
    runs-on: ubuntu-latest
    needs: ml-tests
    if: github.event_name == 'pull_request'
   

    steps:
      - uses: actions/checkout@v4

      - uses: iterative/setup-cml@v2

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-test-results

      - name: Post CML comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## ML CI Test Report" >> cml_comment.md
          echo "" >> cml_comment.md

          if [ -f pytest_output.txt ]; then
            echo "<details><summary>Pytest output</summary>" >> cml_comment.md
            echo "" >> cml_comment.md
            echo '```' >> cml_comment.md
            tail -30 pytest_output.txt >> cml_comment.md
            echo '```' >> cml_comment.md
            echo "</details>" >> cml_comment.md
            echo "" >> cml_comment.md
          fi

          if [ -f metrics_report.md ]; then
            cat metrics_report.md >> cml_comment.md
          fi

          if [ -f metrics.json ]; then
            echo "" >> cml_comment.md
            echo "## Metrics JSON" >> cml_comment.md
            echo '```json' >> cml_comment.md
            cat metrics.json >> cml_comment.md
            echo '' >> cml_comment.md
            echo '```' >> cml_comment.md
          fi

          cml comment create cml_comment.md
