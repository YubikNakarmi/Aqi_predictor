name: "Terraform Apply"
on:
  workflow_dispatch:
    inputs:
        action:
            description: "Select action type"
            required: true
            default: "apply"
            type: choice
            options:
                - apply
                - destroy
        confirm:
            description: "Are you sure you want to proceed with this action?"
            required: true
            type: string
permissions:
    contents: read
    id-token: write

jobs:
    validate-input:
        name: "Validate User Input"
        runs-on: ubuntu-latest
        steps:
            - name: Check word
              run: | #validate inputs for mismatch
                if [[ "${{inputs.confirm}}" != "yes" ]]; then 
                  echo "Action cancelled by user. or use lowercase 'yes' to confirm."
                  exit 1
                fi
                if [[ "${{inputs.action}}" != "apply" && "${{inputs.action}}" != "destroy" ]]; then
                  echo "Invalid action type. Please select 'apply' or 'destroy'."
                  exit 1
                fi
    authenticate-azure:
        name: "Authenticate to Azure"
        runs-on: ubuntu-latest
        needs: validate-input
        steps:
            - name: Azure Login
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }} #OIDC Login with azure and service key creds
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    terraform-plan:
        name: "Terraform Apply"
        runs-on: ubuntu-latest
        needs: authenticate-azure
        env:
              ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
              ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              ARM_USE_OIDC: true
        if: inputs.action == 'apply'
        steps:
           
            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform -chdir=azure-deploy init
            

            - name: Validate Terraform
              run: terraform -chdir=azure-deploy validate
           

            - name: Terraform Plan
              run: terraform -chdir=azure-deploy plan -out=tfplan -var="public_key=${{secrets.SSH_PUBLIC_KEY }}" #nneed public key
            
            - name: Upload Terraform Plan
              uses: actions/upload-artifact@v3
              with:
                name: terraform-plan
                path: azure-deploy/tfplan
                retention-days: 1

    terraform-apply:
        name: "Terraform Apply"
        runs-on: ubuntu-latest
        needs: terraform-plan
        if: inputs.action == 'apply'
        steps:

            - name: checkout code
              uses: actions/checkout@v3

            - name: Azure Login
              uses: azure/login@v3
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }} #OIDC Login with azure and service key creds
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            - name: Set up Terraform
              uses: hashicorp/setup-terraform@v3

           
            - name: Terraform Init
              run: terraform -chdir=azure-deploy init
              env:
                ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                ARM_USE_OIDC: true

            - name: Download Terraform Plan
              uses: actions/download-artifact@v3
              with:
                name: terraform-plan
                path: azure-deploy/tfplan

            - name: Terraform Apply
              run: terraform -chdir=azure-deploy apply -var="public_key=${{secrets.SSH_PUBLIC_KEY }}" -auto-approve #nneed public key
              env:
                ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                ARM_USE_OIDC: true

            - name: Terraform Output
              run: terraform -chdir=azure-deploy output -json
              env:
                ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                ARM_USE_OIDC: true
    
    destroy-plan:
      name: "Terraform Destroy Plan"
      runs-on: ubuntu-latest
      if: inputs.action == 'destroy'
      needs: authenticate-azure
      env:
            ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            ARM_USE_OIDC: true
      steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
          - name: Terraform Init
            run: terraform -chdir=azure-deploy init
          - name: Terraform Destroy Plan
            run: terraform -chdir=azure-deploy plan -destroy -out=tfdestroyplan -var="public_key=${{secrets.SSH_PUBLIC_KEY }}" #nneed public key
          - name: Upload Destroy Plan
            uses: actions/upload-artifact@v3
            with:
              name: tfdestroyplan
              path: azure-deploy/tfdestroyplan
              retention-days: 1

    destroy-apply:
      name: "Terraform Destroy Apply"
      runs-on: ubuntu-latest
      if: inputs.action == 'destroy'
      needs: destroy-plan
      steps:
          - name: checkout code
            uses: actions/checkout@v3

          - name: Azure Login
            uses: azure/login@v3
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }} #OIDC Login with azure and service key creds
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3

          - name: Terraform Init
            run: terraform -chdir=azure-deploy init
            env:
              ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
              ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
              ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              ARM_USE_OIDC: true

          - name: Download Destroy Plan
            uses: actions/download-artifact@v3
            with:
              name: tfdestroyplan