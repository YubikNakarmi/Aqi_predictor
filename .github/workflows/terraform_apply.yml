name: "Terraform Apply"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select action type"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
      confirm:
        description: "Are you sure you want to proceed with this action?"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-input:
    name: "Validate User Input"
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        run: |
          if [[ "${{ inputs.confirm }}" != "yes" ]]; then
            echo "Action cancelled by user. Use lowercase 'yes' to confirm."
            exit 1
          fi
          if [[ -z "${{ secrets.AZURE_CLIENT_SECRET }}" ]]; then
            echo "Missing AZURE_CLIENT_SECRET secret. This workflow uses service-principal secret auth instead of OIDC."
            exit 1
          fi
          if [[ "${{ inputs.action }}" != "apply" && "${{ inputs.action }}" != "destroy" ]]; then
            echo "Invalid action type. Please select 'apply' or 'destroy'."
            exit 1
          fi

  terraform-plan:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: validate-input
    if: inputs.action == 'apply'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=azure-deploy init

      - name: Validate Terraform
        run: terraform -chdir=azure-deploy validate

      - name: Terraform Plan
        run: terraform -chdir=azure-deploy plan -out=tfplan -var="public_key=${{ secrets.SSH_PUBLIC_KEY }}" -var="my-ip=${{ secrets.IP }}"

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: azure-deploy/tfplan
          retention-days: 1

  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: inputs.action == 'apply'
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=azure-deploy init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: azure-deploy

      - name: Terraform Apply
        run: terraform -chdir=azure-deploy apply -auto-approve tfplan

      - name: Terraform Output
        run: terraform -chdir=azure-deploy output -json

  destroy-plan:
    name: "Terraform Destroy Plan"
    runs-on: ubuntu-latest
    if: inputs.action == 'destroy'
    needs: validate-input
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=azure-deploy init

      - name: Validate Terraform
        run: terraform -chdir=azure-deploy validate

      - name: Terraform Destroy Plan
        run: terraform -chdir=azure-deploy plan -destroy -out=tfdestroyplan -var="public_key=${{ secrets.SSH_PUBLIC_KEY }}"

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfdestroyplan
          path: azure-deploy/tfdestroyplan
          retention-days: 1

  destroy-apply:
    name: "Terraform Destroy Apply"
    runs-on: ubuntu-latest
    if: inputs.action == 'destroy'
    needs: destroy-plan
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=azure-deploy init

      - name: Download Destroy Plan
        uses: actions/download-artifact@v4
        with:
          name: tfdestroyplan
          path: azure-deploy

      - name: Terraform Destroy Apply
        run: terraform -chdir=azure-deploy apply -auto-approve tfdestroyplan