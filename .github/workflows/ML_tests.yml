name: tests-eval
on:
  pull_request:
    branches: dev
  push: 
    branches: [dev]
    
jobs:
  setup-server:
    runs-on: ubuntu-slim
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{secrets.AZURE_STORAGE_CONNECTION_STRING}}
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
   
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.1

      - name: install dependencies
        run:
          pip install mlflow azure-storage-blob 

      - name: start server
        run: |
          mlflow server \
            --backend-store-uri sqlite:///db/mlflow.db \
            --default-artifact-root wasbs://mlflow@yubikaqidata.blob.core.windows.net \
            --host 127.0.0.1 \
            --port 5000 &
          sleep 10
      - name: smoke test
        run: 
      - name: Basic connectivity test
        run: |
          python - <<EOF
          import mlflow
          mlflow.search_experiments()
          print("MLflow reachable")
          EOF
  eval:
    runs-on: ubuntu-latest
    needs: setup-server
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{secrets.AZURE_STORAGE_CONNECTION_STRING}}
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    steps:

