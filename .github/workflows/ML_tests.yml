name: tests-eval
on:
  pull_request:
    branches: dev
    
env:
  token = ${{secrets.GITHUB_TOKEN}}
   
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 
      uses: actions/checkout@v3
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
          python-version: 3.9
    - name: Setup CML
      uses: iterative/setup-cml@v2
      

